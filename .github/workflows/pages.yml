# Publikacja aplikacji „Jak się logujemy?” na GitHub Pages.
# Każdy push na main: testy, build, a zbudowane 04_app/dist trafia na gałąź gh-pages.
# Jednorazowo w ustawieniach repozytorium: Settings → Pages → Source: Deploy from a branch → gh-pages, / (root).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04_app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publikacja dist na gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publikacja ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
